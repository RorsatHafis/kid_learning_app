# Production only (mounted by deploy/compose.production.yml): requests reach the web front through
# Caddy, so the address nginx sees is Caddy's. Believe the client address Caddy puts in
# X-Forwarded-For when the request comes from the container network (private ranges) - and only then -
# so the backend's sign-in, registration and recovery limits apply per person, not to everyone at once.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
