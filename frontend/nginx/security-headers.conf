# Included in every location (nginx drops server-level add_header lines inside a location
# that adds its own).
# The app loads nothing from other origins: scripts, styles, fonts and images are all its own,
# and it only talks to its own /api. No third-party analytics, ads or embeds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Emailed links carry their token in the URL fragment, which browsers never send as a
# referrer; "no-referrer" makes sure no other part of a URL leaves the app either.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
