# Bookeyond Kid web front: static app + /api reverse proxy.
# BACKEND is the backend's address inside the container network (docker-compose service name).

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # API requests are small JSON bodies; nothing is uploaded through this proxy yet.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This proxy is the edge: it replaces, never appends to, whatever the client sent,
        # so the backend's per-client limits see the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Vite puts a content hash in every asset name, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is the single-page app; the page itself is always revalidated so a
    # new release is picked up on the next visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
