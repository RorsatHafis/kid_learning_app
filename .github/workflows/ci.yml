# Every push and pull request: the whole release gate that can run without real
# production infrastructure. Each step is the same command used locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests (PostgreSQL 18 in a container)
        run: ./mvnw -B -Pintegration test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # Known vulnerabilities in what ships to browsers fail the build.
      - run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: End-to-end journeys and accessibility (Docker stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-signing-key-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
      ADMIN_BOOTSTRAP: "true"
      ADMIN_EMAIL: admin@bk-ci.test
      ADMIN_PASSWORD: CI-Admin-Pass-2026
      E2E_ADMIN_EMAIL: admin@bk-ci.test
      E2E_ADMIN_PASSWORD: CI-Admin-Pass-2026
      # The journeys (desktop and phone) register more than 20 accounts from one address within the hour.
      RATE_LIMIT_REGISTER_PER_HOUR: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the product
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      # Deployment behaviour: headers, migrations, invalid requests, media through nginx and on its
      # volume, restart and replacement of the backend (scripts/verify-runtime.sh says what it checks).
      - name: Runtime checks
        run: bash scripts/verify-runtime.sh
      # The legal-agreement and second-person-review journeys skip on the default stack (both are
      # off by default); restart the backend with them on and run those journeys for real.
      - name: Turn on legal documents, content review and the erasure ledger
        # Only the backend is replaced; the web front finds it on its new address by itself (nginx
        # resolves it per request), so this step also proves that recovery.
        run: docker compose -f docker-compose.yml -f .github/compose.features.yml up -d --wait backend
      - name: Configuration-specific journeys
        run: npx playwright test e2e/legal.spec.ts e2e/review-journey.spec.ts
        working-directory: frontend
      - name: Those journeys ran rather than skipped
        run: test "$(curl -fsS http://localhost:5173/api/v1/auth/legal | jq -r .version)" = ci-1
      - name: Server logs
        if: failure()
        run: docker compose logs --no-color --tail 300 backend web
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
      - name: Stop
        if: always()
        run: docker compose down --volumes
