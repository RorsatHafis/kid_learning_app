# Every push and pull request: the whole release gate that can run without real
# production infrastructure. Each step is the same command used locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests (PostgreSQL 18 in a container)
        run: ./mvnw -B -Pintegration test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # Known vulnerabilities in what ships to browsers fail the build.
      - run: npm audit --omit=dev --audit-level=moderate

  deployment-files:
    name: Production deployment files and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (ShellCheck)
        run: shellcheck -S warning scripts/*.sh
      - name: The settings template is refused until filled in
        run: "! bash scripts/check-production-settings.sh deploy/production.settings.example"
      - name: A complete settings file is accepted and the production Compose file resolves
        run: |
          cat > "$RUNNER_TEMP/ci.settings" <<EOF
          APP_DOMAIN=app.bk-ci.example
          APP_PUBLIC_URL=https://app.bk-ci.example
          CORS_ALLOWED_ORIGINS=https://app.bk-ci.example
          ACME_EMAIL=ops@bk-ci.example
          JWT_SECRET=$(openssl rand -base64 48)
          JWT_ISSUER=bookeyond-kid-ci
          DB_PASSWORD=$(openssl rand -hex 24)
          MAIL_HOST=smtp.bk-ci.example
          MAIL_USERNAME=bookeyond
          MAIL_PASSWORD=$(openssl rand -hex 16)
          MAIL_FROM=no-reply@bk-ci.example
          EOF
          bash scripts/check-production-settings.sh "$RUNNER_TEMP/ci.settings"
      - name: Backup pruning keeps the newest days and older weeks
        run: |
          dir="$(mktemp -d)"
          for day in 01 05 10 15 20 25 30; do mkdir "$dir/bookeyond-kid-202609${day}T023000Z"; done
          for day in 03 05 07 09 11; do mkdir "$dir/bookeyond-kid-202610${day}T023000Z"; done
          KEEP_DAILY=3 KEEP_WEEKLY=2 bash scripts/prune-backups.sh "$dir" --yes
          test "$(echo $(ls "$dir"))" = "bookeyond-kid-20260925T023000Z bookeyond-kid-20261003T023000Z bookeyond-kid-20261007T023000Z bookeyond-kid-20261009T023000Z bookeyond-kid-20261011T023000Z"

  e2e:
    name: End-to-end journeys and accessibility (Docker stack)
    needs: [backend, frontend, deployment-files]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-signing-key-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
      ADMIN_BOOTSTRAP: "true"
      ADMIN_EMAIL: admin@bk-ci.test
      ADMIN_PASSWORD: CI-Admin-Pass-2026
      E2E_ADMIN_EMAIL: admin@bk-ci.test
      E2E_ADMIN_PASSWORD: CI-Admin-Pass-2026
      # The journeys (desktop and phone) register more than 20 accounts from one address within the hour.
      RATE_LIMIT_REGISTER_PER_HOUR: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the product
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      # Deployment behaviour: headers, migrations, invalid requests, media through nginx and on its
      # volume, restart and replacement of the backend (scripts/verify-runtime.sh says what it checks).
      - name: Runtime checks
        run: bash scripts/verify-runtime.sh
      # The legal-agreement and second-person-review journeys skip on the default stack (both are
      # off by default); restart the backend with them on and run those journeys for real.
      - name: Turn on legal documents, content review and the erasure ledger
        # Only the backend is replaced; the web front finds it on its new address by itself (nginx
        # resolves it per request), so this step also proves that recovery.
        run: docker compose -f docker-compose.yml -f .github/compose.features.yml up -d --wait backend
      - name: Configuration-specific journeys
        run: npx playwright test e2e/legal.spec.ts e2e/review-journey.spec.ts
        working-directory: frontend
      - name: Those journeys ran rather than skipped
        run: test "$(curl -fsS http://localhost:5173/api/v1/auth/legal | jq -r .version)" = ci-1
      - name: Server logs
        if: failure()
        run: docker compose logs --no-color --tail 300 backend web
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
      - name: Stop
        if: always()
        run: docker compose down --volumes
