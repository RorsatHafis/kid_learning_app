spring:
  application:
    name: learning-platform-api

  # No defaults on purpose: every environment (local, test, staging, production) must
  # supply these explicitly via env vars. A missing value should fail startup loudly,
  # never silently fall back to a local or wrong database.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    # Values some data migrations need from application configuration (V34 converts
    # stored mastery using the same learning rate MasteryEngine computed it with).
    # Defaults match the documented platform.mastery defaults (.env.example).
    placeholders:
      "[mastery_learning_rate]": ${platform.mastery.learning-rate:0.2}
      "[objective_mastery_threshold]": ${platform.mastery.objective-mastery-threshold:0.8}

  jpa:
    # Flyway owns the schema. Hibernate only validates entity mappings against it;
    # it must never create or alter tables itself.
    hibernate:
      ddl-auto: validate
    # Default is true; disabling forces lazy-loading issues to surface where transactions
    # are actually managed (the application service layer), not hidden behind view rendering.
    open-in-view: false
    properties:
      hibernate:
        # Persist and compare all instants in UTC regardless of server/DB host timezone.
        jdbc:
          time_zone: UTC

  # X11 media uploads: a recording is at most 5 MB (MediaInspector); a little room for the form.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Outgoing email (address verification, password reset). MAIL_HOST is required: an
  # environment that cannot send mail cannot let a parent recover their account, so it
  # must not start as though it could. Credentials are optional (some relays
  # authenticate by network); TLS is on unless explicitly turned off.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

# External configuration contract (the full list is ConfigurationContract.VARIABLES).
# Operators set the environment variables named here; every profile honours them.
# Setting the underlying property through its own environment variable
# (PLATFORM_SECURITY_JWT_SECRET, ...) is refused at startup, so no setting can be
# controlled by two variables. Values without a default are required: a missing one
# fails startup. Defaults are the documented values (see .env.example), and every value
# is validated when it binds (SecurityProperties, MasteryProperties, SecurityConfig).
platform:
  security:
    jwt:
      # Required. At least 32 bytes (HS256). Only the local profile supplies a dev value.
      secret: ${JWT_SECRET}
      # Required. Tokens from any other issuer are rejected, so give each environment its own.
      issuer: ${JWT_ISSUER}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
      # A rotated refresh token may be retried once by the same browser for this long when
      # the response carrying its replacement was lost (the replacement still unused).
      # 0s = strict single use. At most 2m.
      refresh-reuse-grace: ${REFRESH_TOKEN_REUSE_GRACE:30s}
    lockout:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      duration: ${LOGIN_LOCKOUT_DURATION:15m}
    # Per client address on the unauthenticated identity endpoints (logout shares the
    # refresh budget; using an emailed link shares the login budget). Generous: families and schools share addresses behind NAT.
    rate-limit:
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:20}
      register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:20}
      refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:60}
      # Password-reset requests (each may send an email).
      recovery-per-hour: ${RATE_LIMIT_RECOVERY_PER_HOUR:10}
    # PD-02 as adopted (Y13): every request checks that its sign-in is still live, so signing out,
    # a password change or a suspension takes effect at once. false = trust a token until it expires
    # (JWT_ACCESS_TOKEN_TTL). One answer is reused for SESSION_CHECK_CACHE_TTL (0s..1m).
    session-check:
      enabled: ${SESSION_CHECK_ENABLED:true}
      cache-ttl: ${SESSION_CHECK_CACHE_TTL:10s}
    cors:
      # Exact browser origins (scheme://host[:port]) the frontend is served from,
      # comma-separated. No default on purpose, like the datasource: staging and
      # production must name their own frontend origin(s) - a missing value fails
      # startup instead of silently trusting a development origin. An explicitly
      # empty value allows no cross-origin browser access at all.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    # Required. The sender on every email, e.g. no-reply@bookeyond.example.
    from: ${MAIL_FROM}
    # Required. The origin families open the app at; links in emails point here.
    public-url: ${APP_PUBLIC_URL}
  media:
    # Required. A directory the API can write: where uploaded pictures and recordings are kept.
    # In production a persistent volume, backed up with the database (DEPLOYMENT.md).
    root: ${MEDIA_ROOT}
  # PD-20 (Y14): whether platform content needs a second administrator's approval before it is published.
  # Off by default (an author publishes); a teacher's own content never needs it.
  content-review:
    required: ${CONTENT_REVIEW_REQUIRED:false}
  # Deleting a child or a family account (PD-24 as adopted, Y3). A deletion waits this long
  # before it is carried out, so a mistake can be undone (0s..90d); the sweep runs this often.
  erasure:
    grace-period: ${ERASURE_GRACE_PERIOD:7d}
    sweep-interval: ${ERASURE_SWEEP_INTERVAL:PT1H}
    sweep-enabled: ${ERASURE_SWEEP_ENABLED:true}
  mastery:
    learning-rate: ${MASTERY_LEARNING_RATE:0.2}
    confidence-saturation-count: ${MASTERY_CONFIDENCE_SATURATION_COUNT:10}
    objective-mastery-threshold: ${MASTERY_OBJECTIVE_THRESHOLD:0.8}

server:
  port: ${SERVER_PORT:8080}
  # Behind the reverse proxy the client's address (which sign-in, registration and recovery
  # budgets are keyed on) comes from X-Forwarded-For. "native" lets Tomcat believe only the
  # entries appended by trusted proxies - by default private, loopback and link-local
  # addresses; override with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (a regex) when the proxy
  # has a public address. "framework" would believe the left-most entry, which the client
  # writes itself (ForwardedClientAddressIntegrationTests).
  forward-headers-strategy: native
  # X11: an upload over the multipart limit is still read to its end (up to this much) so the
  # author gets the 413 explaining the limit instead of a dropped connection.
  tomcat:
    max-swallow-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # A mail server outage must not take the API out of the load balancer: sign-in and
    # learning keep working, and delivery failures are logged.
    mail:
      enabled: false
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true


logging:
  pattern:
    # Deliberately simplified vs. Boot's default colorized pattern — adds the
    # correlation id without trying to precisely recreate Boot's internal
    # pattern DSL. Can be prettified later; correctness over cosmetics for now.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId}] %logger{36} - %msg%n"