spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/learning_platform}
    # DB_USERNAME / DB_PASSWORD (the names every profile uses, and what docker-compose
    # passes to the backend container) win. Locally they fall back to POSTGRES_USER /
    # POSTGRES_PASSWORD, which .env also uses to create the Compose database.
    username: ${DB_USERNAME:${POSTGRES_USER:learning_platform}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:learning_platform}}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Dev-only fallback: Mailpit (docker-compose `mailpit`, web UI on :8025) - catches
  # every message, delivers nothing to real mailboxes.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS:false}

# Local-only fallbacks for the values application.yaml requires. The same variables
# still override them; TTL, lockout and mastery defaults come from application.yaml.
platform:
  # Y43: development payments are simulated here (labelled TEST PAYMENT; never real money).
  payments:
    dev-simulator:
      enabled: ${PAYMENTS_DEV_SIMULATOR_ENABLED:true}
  security:
    jwt:
      # Dev-only fallback; every other profile must provide JWT_SECRET.
      secret: ${JWT_SECRET:local-development-only-secret-not-for-production-use-0123456789}
      issuer: ${JWT_ISSUER:yulme-api}
    cors:
      # Dev-only fallback: the Vite dev server. Its proxy forwards the browser's
      # Origin while rewriting Host, so the backend sees these calls as cross-origin.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media:
    # Dev-only fallback, next to where the API runs (git-ignored).
    root: ${MEDIA_ROOT:./media}
  mail:
    from: ${MAIL_FROM:no-reply@bookeyond-kid.localhost}
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway