spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  flyway:
    clean-disabled: true

logging:
  # One JSON object per line (Elastic Common Schema) for the log platform: every field,
  # including the request's correlationId, is searchable. Accounts appear by id only.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: bookeyond-kid-api
  level:
    root: WARN
    com.platform: INFO

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false