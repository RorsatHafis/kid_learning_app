spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    clean-disabled: true

logging:
  # One JSON object per line (Elastic Common Schema) for the log platform: every field,
  # including the request's correlationId, is searchable. Accounts appear by id only.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: bookeyond-kid-api
  level:
    root: INFO
    com.platform: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized