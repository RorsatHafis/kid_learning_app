spring:
  application:
    name: learning-platform-api

  # No defaults on purpose: every environment (local, test, staging, production) must
  # supply these explicitly via env vars. A missing value should fail startup loudly,
  # never silently fall back to a local or wrong database.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only validates entity mappings against it;
    # it must never create or alter tables itself.
    hibernate:
      ddl-auto: validate
    # Default is true; disabling forces lazy-loading issues to surface where transactions
    # are actually managed (the application service layer), not hidden behind view rendering.
    open-in-view: false
    properties:
      hibernate:
        # Persist and compare all instants in UTC regardless of server/DB host timezone.
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true


logging:
  pattern:
    # Deliberately simplified vs. Boot's default colorized pattern — adds the
    # correlation id without trying to precisely recreate Boot's internal
    # pattern DSL. Can be prettified later; correctness over cosmetics for now.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId}] %logger{36} - %msg%n"